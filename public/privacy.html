  .lang-switch { margin-left:auto; display:flex; gap:6px; }
  .lang-switch button { border:1px solid var(--beige); background:#fff; border-radius:999px; padding:6px 12px; font-size:0.8rem; font-weight:600; cursor:pointer; color:var(--muted); }
  .lang-switch button.active { background:var(--bronze); color:#fff; border-color:var(--bronze); }
  main { max-width:760px; margin:0 auto; padding:32px 24px 80px; }
  h2.title { font-family:'Playfair Display',serif; font-size:1.8rem; color:var(--bronze); margin:0 0 6px; }

  .intro, .footer-text { font-size:0.95rem; line-height:1.6; margin-bottom:20px; }
  .footer-text { text-align:center; font-weight:600; color:var(--bronze); margin-top:24px; }
  h3 { font-family:'Playfair Display',serif; font-size:1.15rem; color:var(--bronze); margin:24px 0 10px; }
  h4 { font-size:0.98rem; color:var(--charcoal); margin:16px 0 6px; }
  p { font-size:0.95rem; line-height:1.65; margin:0 0 10px; white-space:pre-line; }
  @media (prefers-color-scheme: dark) {
    :root { --ivory:#1C1917; --charcoal:#F2EDE9; --beige:#3A322D; }

function esc(s) {
  const d = document.createElement('div');
  d.innerText = s;
  return d.innerHTML;
}

function render(lang) {
  const c = content[lang] || content.pt;
  document.getElementById('headerTitle').innerText = c.headerTitle;
  document.title = c.headerTitle + ' — Viscare';
  let html = `<h2 class="title">${esc(c.title)}</h2><div class="updated">${esc(c.lastUpdated)}</div><p class="intro">${esc(c.intro)}</p>`;
  c.sections.forEach(s => {
    html += `<h3>${esc(s.title)}</h3>`;
    s.texts.forEach(t => { html += `<p>${esc(t)}</p>`; });
    if (s.subs) {
      s.subs.forEach(sub => {
        html += `<h4>${esc(sub.title)}</h4><p>${esc(sub.body)}</p>`;
      });
    }
  });
  html += `<p class="footer-text">${esc(c.footer)}</p>`;
  document.getElementById('main').innerHTML = html;
  document.querySelectorAll('.lang-switch button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  localStorage.setItem('viscare_site_lang', lang);
}

document.querySelectorAll('.lang-switch button').forEach(b => {
  b.addEventListener('click', () => render(b.dataset.lang));
});

const browserLang = (navigator.language || 'pt').slice(0,2);
const initialLang = localStorage.getItem('viscare_site_lang') || (content[browserLang] ? browserLang : 'pt');
render(initialLang);
</script>

</html>
