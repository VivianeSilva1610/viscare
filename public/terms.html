function esc(s) {
  const d = document.createElement('div');
  d.innerText = s;
  return d.innerHTML;
}

function render(lang) {
  const c = content[lang] || content.pt;
  document.getElementById('headerTitle').innerText = c.headerTitle;
  document.title = c.headerTitle + ' — Viscare';
  let html = `<h2 class="title">${esc(c.title)}</h2><div class="updated">${esc(c.lastUpdated)}</div><p class="intro">${esc(c.intro)}</p>`;
  c.sections.forEach(s => {
    html += `<h3>${esc(s.title)}</h3>`;
    s.texts.forEach(t => { html += `<p>${esc(t)}</p>`; });
    if (s.note) html += `<p class="note">${esc(s.note)}</p>`;
  });
  html += `<p class="footer-text">${esc(c.footer)}</p>`;
  document.getElementById('main').innerHTML = html;
  document.querySelectorAll('.lang-switch button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  localStorage.setItem('viscare_site_lang', lang);
}

document.querySelectorAll('.lang-switch button').forEach(b => {
  b.addEventListener('click', () => render(b.dataset.lang));
});

const browserLang = (navigator.language || 'pt').slice(0,2);
const initialLang = localStorage.getItem('viscare_site_lang') || (content[browserLang] ? browserLang : 'pt');
render(initialLang);
